name: Deploy Tsamaya website

# Builds the static site and publishes it to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero npm dependencies — just run the build.
      # Public client keys for the live-trip tracker (/t/) are injected from repo
      # secrets into dist/config.json so they're never committed to source.
      - name: Build site
        run: node build.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      # Gate the deploy on the SEO invariants. This exists because the sitemap and
      # the page canonicals silently drifted apart in production — the home page
      # advertised itself at two different URLs for weeks and nothing caught it.
      # Also fails on a missing image, a duplicate title, a page with no structured
      # data, or the token-bearing live-trip page losing its noindex.
      - name: Check SEO invariants
        run: node scripts/check-seo.mjs
      # Which pages differ from the ones live right now, measured BEFORE the
      # deploy replaces them. The indexnow job below tells Bing (the index behind
      # Copilot) about exactly those, so unchanged pages are never re-pinged.
      # Never blocks a deploy.
      - name: List changed pages for IndexNow
        id: changed
        continue-on-error: true
        run: |
          {
            echo 'urls<<INDEXNOW_EOF'
            node scripts/indexnow.mjs changed
            echo 'INDEXNOW_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing and the other IndexNow engines which pages just changed
  # (scripts/indexnow.mjs). Runs only after a successful deploy, so the engine
  # fetches the new page and the key file is live. A failure here is logged and
  # never touches the deploy.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.changed != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit changed pages to IndexNow
        env:
          URLS: ${{ needs.build.outputs.changed }}
        run: node scripts/indexnow.mjs submit $URLS
