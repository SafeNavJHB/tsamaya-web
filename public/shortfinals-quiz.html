<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Open a quiz in Short Finals</title>
<meta name="description" content="Opens a quiz your instructor shared in the Short Finals app.">
<link rel="canonical" href="https://tsamayaapp.co.za/shortfinals-quiz.html">
<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebPage","name":"Open a quiz in Short Finals","url":"https://tsamayaapp.co.za/shortfinals-quiz.html"}]}</script>
<style>
  :root { color-scheme: light dark; --bg: #f4f6fa; --card: #fff; --text: #111827; --muted: #5b6b82; --accent: #1f6fb8; --on: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1e3d; --card: #17284d; --text: #f1f5f9; --muted: #a7b4c8; --accent: #5aa2e6; --on: #0f1e3d; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border-radius: 18px; padding: 24px; box-sizing: border-box; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 16px; }
  .what { font-weight: 600; overflow-wrap: anywhere; }
  .note { margin: 16px 0 0; color: var(--muted); font-size: 14px; }
  a.open { display: block; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--on); text-align: center; font-weight: 600; text-decoration: none; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>A quiz from your instructor</h1>
  <div id="ok" hidden>
    <p id="what" class="what" hidden></p>
    <p>Open it in Short Finals to start the quiz.</p>
    <a id="open" class="open" href="#">Open in Short Finals</a>
    <p class="note">You need Short Finals on this phone. The quiz is only in this link: it isn't sent to our website.</p>
  </div>
  <p id="bad" hidden>This link is incomplete. Ask your instructor to send it again.</p>
</main>
<script>
  // The quiz is everything after the #, which browsers don't send to a server. It goes to the app
  // unchanged, and is only ever shown here as plain text. The app reads the same link itself when
  // it is installed (a universal link or Android app link), so this page is for when it isn't.
  var query = location.hash.slice(1);
  var read = function (key) {
    var match = new RegExp('(?:^|&)' + key + '=([^&]*)').exec(query);
    if (!match) return '';
    try { return decodeURIComponent(match[1].replace(/\+/g, ' ')); } catch (e) { return ''; }
  };
  var cards = read('c').split(',').filter(Boolean).length;
  if (read('v') && cards) {
    document.getElementById('open').href = 'shortfinals://quiz?' + query;
    document.getElementById('ok').hidden = false;
    var title = read('t').replace(/\s+/g, ' ').trim().slice(0, 60);
    var count = cards === 1 ? '1 question' : cards + ' questions';
    var line = document.getElementById('what');
    line.textContent = title ? title + ' · ' + count : count;
    line.hidden = false;
  } else {
    document.getElementById('bad').hidden = false;
  }
</script>
</body>
</html>
